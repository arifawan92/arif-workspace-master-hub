<!DOCTYPE html>
<html lang="ur"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PEOS - Personal Engineering OS</title><style>body{font-family:system-ui;background:#0f172a;color:#e2e8f0;padding:20px;max-width:900px;margin:auto}h1{color:#38bdf8;text-align:center}.card{background:#1e293b;padding:15px;border-radius:12px;margin:15px 0;border:1px solid #334155}input,textarea{width:100%;padding:10px;margin:5px 0;background:#0f172a;color:#fff;border:1px solid #475569;border-radius:8px}button{padding:10px 16px;background:#38bdf8;color:#000;border:none;border-radius:8px;cursor:pointer;font-weight:bold;margin:3px}button.del{background:#ef4444;color:#fff}.log{font-size:13px;color:#94a3b8;max-height:200px;overflow:auto;background:#0f172a;padding:10px;border-radius:8px}.item{background:#0f172a;padding:8px;margin:5px 0;border-radius:6px;display:flex;justify-content:space-between}</style></head><body><h1>PEOS - Personal Engineering OS</h1><p style="text-align:center;color:#94a3b8">Offline | Single File | Owner: Muhammad Arif</p><div class="card"><h3>1. Note System</h3><input id="noteInput" placeholder="Naya note..."><button onclick="saveNote()">Save Note</button><div id="noteList"></div></div><div class="card"><h3>2. Failure Log</h3><input id="failInput" placeholder="Failure..."><button onclick="saveFail()" style="background:#fbbf24">Save Fail</button><div id="failList"></div></div><div class="card"><h3>3. Audit Log</h3><div id="auditList" class="log"></div><button onclick="clearAll()" class="del">Sab Delete</button></div><script>let notes=JSON.parse(localStorage.getItem('peos_notes')||'[]');let fails=JSON.parse(localStorage.getItem('peos_fails')||'[]');let audit=JSON.parse(localStorage.getItem('peos_audit')||'[]');function addAudit(a){let t=new Date().toLocaleString('en-PK');audit.unshift(t+" - "+a);if(audit.length>100)audit.pop();localStorage.setItem('peos_audit',JSON.stringify(audit));render()}function saveNote(){let v=document.getElementById('noteInput').value.trim();if(!v)return;notes.unshift({text:v,time:new Date().toLocaleString('en-PK')});localStorage.setItem('peos_notes',JSON.stringify(notes));document.getElementById('noteInput').value='';addAudit("Note: "+v.slice(0,20))}function saveFail(){let v=document.getElementById('failInput').value.trim();if(!v)return;fails.unshift({text:v,time:new Date().toLocaleString('en-PK')});localStorage.setItem('peos_fails',JSON.stringify(fails));document.getElementById('failInput').value='';addAudit("Fail: "+v.slice(0,20))}function deleteNote(i){if(!confirm('Kya waqai delete karna hai?'))return;if(!confirm('Pakka? Kya waqai?'))return;notes.splice(i,1);localStorage.setItem('peos_notes',JSON.stringify(notes));addAudit("Note del "+i)}function deleteFail(i){if(!confirm('Kya waqai fail delete?'))return;if(!confirm('Pakka? Kya waqai?'))return;fails.splice(i,1);localStorage.setItem('peos_fails',JSON.stringify(fails));addAudit("Fail del "+i)}function clearAll(){if(!confirm('Kya waqai sab delete?'))return;if(!confirm('Aakhri - Kya waqai?'))return;localStorage.clear();notes=[];fails=[];audit=[];render()}function render(){document.getElementById('noteList').innerHTML=notes.map((n,i)=>`<div class="item"><span>${n.time} - ${n.text}</span><button class="del" onclick="deleteNote(${i})">X</button></div>`).join('');document.getElementById('failList').innerHTML=fails.map((n,i)=>`<div class="item" style="border-left:3px solid #ef4444"><span>${n.time} - ${n.text}</span><button class="del" onclick="deleteFail(${i})">X</button></div>`).join('');document.getElementById('auditList').innerHTML=audit.join('<br>')}render();addAudit("PEOS Opened")}</script></body></html>
